<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Leckortung" />
    <title>Leckortungsbericht</title>

    <style>
        :root { 
            --accent: #b89b1e; 
            --accent-hover: #9c8319;
            --primary: #1e293b; 
            --text: #334155; 
            --text-light: #64748b;
            --bg: #f1f5f9; 
            --surface: #ffffff; 
            --border: #cbd5e1; 
            --input-bg: #f8fafc;
            --radius: 10px;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        
        * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        @page { size: A4; margin: 0 !important; }

        body { 
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 40px 10px; 
            color: var(--text); 
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            width: 210mm; 
            min-height: 297mm; 
            background: var(--surface); 
            padding: 15mm 15mm 20mm 15mm;
            margin: 0 auto 30px auto; 
            position: relative; 
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            overflow: hidden;
        }

        /* Header Styling */
        .header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--accent); padding-bottom: 15px; margin-bottom: 25px; }
        .header-left { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
        .logo { max-height: 60px; width: auto; object-fit: contain; }
        .header-left h1 { margin: 0; font-size: 24px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
        .header-right { text-align: right; font-size: 11px; line-height: 1.4; color: var(--text-light); }
        .header-right strong { color: var(--primary); font-size: 13px; }

        /* Sections & Typografie */
        .section { margin-bottom: 25px; }
        .section h2 { font-size: 14px; text-transform: uppercase; border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-bottom: 15px; color: var(--primary); font-weight: 700; letter-spacing: 0.5px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .address-grid { display: grid; grid-template-columns: 80px 1fr 1.2fr; gap: 10px; margin-top: 10px; }
        .label { font-size: 12px; font-weight: 600; margin-bottom: 6px; display: block; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Inputs & Forms */
        input[type="text"], input[type="date"], input[type="number"], textarea, select { 
            width: 100%; border: 1px solid var(--border); padding: 12px 14px; font-size: 14px; 
            border-radius: 8px; background: var(--input-bg); color: var(--primary); outline: none; 
            transition: all 0.2s ease; font-family: inherit;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px rgba(184, 155, 30, 0.15); }
        textarea { min-height: 80px; resize: none; overflow: hidden; line-height: 1.5; }

        /* Checkboxen (Desktop) */
        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
        .checkbox-group-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 13px; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text); padding: 6px 0; font-weight: 500; }
        .checkbox-item input { width: 18px; height: 18px; margin: 0; cursor: pointer; accent-color: var(--accent); }

        /* Container Styles */
        .bauteile-container { margin-bottom: 15px; border: 1px solid var(--border); padding: 15px; border-radius: var(--radius); background: var(--surface); border-left: 5px solid var(--accent); }
        .bauteile-container.pool { border-left-color: #2b83b8; }

        /* Skizze */
        .drawing-area {
            border: 2px solid var(--border); cursor: crosshair; touch-action: none; position: relative; width: 100%; border-radius: var(--radius);
            background-color: #ffffff; background-image: linear-gradient(var(--bg) 1px, transparent 1px), linear-gradient(90deg, var(--bg) 1px, transparent 1px);
            background-size: 20px 20px; background-position: -1px -1px;
        }
        .sketch-box { height: 450px; margin-top: 10px; }
        .toolbar { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; background: var(--input-bg); padding: 12px 15px; border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto; }
        .tool { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.15); transition: transform 0.2s; }
        .tool.active { border-color: var(--primary); transform: scale(1.15); }
        .tool.eraser { background: #fff; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; }

        /* Fotos */
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        .photo-box { border: 1px solid var(--border); padding: 12px; text-align: center; background: var(--input-bg); border-radius: var(--radius); }
        .img-container { position: relative; width: 100%; height: 260px; background: #fff; margin-bottom: 12px; overflow: hidden; cursor: crosshair; border-radius: 6px; border: 1px solid #e2e8f0; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .marker-arrow { position: absolute; width: 45px; height: 45px; transform: translate(-100%, -100%); pointer-events: none; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.5)); }
        .photo-desc { width: 100%; border: none; border-bottom: 2px solid var(--accent); background: transparent; font-size: 14px; padding: 8px 0; text-align: center; font-weight: 500; }

        /* Footer */
        .footer { position: absolute; bottom: 15mm; left: 15mm; right: 15mm; font-size: 11px; display: flex; justify-content: space-between; color: var(--text-light); border-top: 1px solid var(--border); padding-top: 10px; font-weight: 600; }

        /* Desktop Controls */
        #controls { position: fixed; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 10px; width: 220px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 15px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.4); }
        button { padding: 14px 15px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button.primary-btn { background: var(--accent); }

        /* =========================================
           S23 / MOBILE OPTIMIERUNG
           ========================================= */
        @media screen and (max-width: 768px) {
            body { padding: 0; background: var(--bg); }
            
            /* S23 App-Bottom-Dock */
            #controls { 
                position: fixed; top: auto; bottom: 0; left: 0; right: 0; width: 100%; 
                flex-direction: row; flex-wrap: nowrap; overflow-x: auto; 
                gap: 12px; padding: 15px 15px calc(15px + env(safe-area-inset-bottom)); 
                background: rgba(30, 41, 59, 0.98); backdrop-filter: blur(15px);
                border-radius: 20px 20px 0 0; border: none; box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
                -webkit-overflow-scrolling: touch; scrollbar-width: none;
            }
            #controls::-webkit-scrollbar { display: none; }
            #controls hr { display: none; }
            #controls button { flex: 0 0 auto; width: auto; min-width: 140px; padding: 14px 20px; font-size: 13px; border-radius: 25px; background: rgba(255,255,255,0.15); }
            #controls button.primary-btn { background: var(--accent); }
            
            .page { width: 100%; min-height: auto; margin: 0 0 90px 0; padding: 25px 15px; border-radius: 0; box-shadow: none; border-bottom: 1px solid var(--border); }
            
            /* Header Zentriert */
            .header { flex-direction: column; align-items: center; text-align: center; gap: 15px; border-width: 2px; }
            .header-left { align-items: center; }
            .header-right { text-align: center; font-size: 12px; }
            
            /* Inputs für Daumen optimiert (16px verhindert Auto-Zoom auf S23!) */
            input[type="text"], input[type="date"], input[type="number"], textarea, select { font-size: 16px !important; padding: 15px; }
            .grid, .address-grid { grid-template-columns: 1fr; gap: 15px; }
            
            /* Große, daumenfreundliche Checkbox-Listen */
            .checkbox-group, .checkbox-group-3 { grid-template-columns: 1fr; gap: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
            .checkbox-item { padding: 16px 15px; border-bottom: 1px solid var(--bg); margin: 0; }
            .checkbox-item:last-child { border-bottom: none; }
            .checkbox-item input { width: 22px; height: 22px; }
            .checkbox-item span { font-size: 15px; }
            
            .sketch-box { height: 65vh; border-radius: 12px; }
            .photo-grid { grid-template-columns: 1fr; }
            .img-container { height: 320px; border-radius: 10px; }
            .footer { position: relative; bottom: auto; left: auto; right: auto; margin-top: 40px; }
        }

        /* =========================================
           Druck / PDF Export
           ========================================= */
        @media print {
            body { background: #fff !important; padding: 0 !important; margin: 0 !important; color: #000 !important; }
            #controls, .toolbar, .no-print, #photoInput, #importFile { display: none !important; }
            body:not(.sketch-enabled) #sketchPage { display: none !important; }
            
            .page {
                margin: 0 !important; box-shadow: none !important; border: none !important; border-radius: 0 !important;
                width: 210mm; min-height: 297mm; height: 297mm; padding: 10mm 15mm 15mm 15mm !important;
                page-break-after: always; break-after: page; page-break-inside: avoid; break-inside: avoid;
                position: relative;
            }
            .page:last-of-type { page-break-after: auto; break-after: auto; }
            
            input[type="text"], input[type="date"], input[type="number"], textarea, select, .photo-desc {
                border: none !important; background: transparent !important; padding: 0 !important; 
                -webkit-appearance: none; appearance: none; color: #000 !important;
                font-size: 11pt !important; box-shadow: none !important; resize: none !important;
            }
            .label { color: #555 !important; font-size: 8pt !important; margin-bottom: 2px !important; }
            .section h2 { color: #000 !important; border-bottom: 1px solid #ccc !important; font-size: 11pt !important; }
            
            .checkbox-group, .checkbox-group-3 { grid-template-columns: 1fr 1fr; border: none; gap: 5px; }
            .checkbox-item { padding: 2px 0; border: none; color: #000 !important; }
            input[type="checkbox"] { appearance: auto !important; -webkit-appearance: auto !important; accent-color: #000 !important; width: 14px; height: 14px; }

            .bauteile-container { border: 1px solid #000 !important; background: transparent !important; box-shadow: none !important; padding: 8px !important; margin-bottom: 10px !important; border-left: 1px solid #000 !important; }
            
            .drawing-area { border: 1px solid #000 !important; background: transparent !important; }
            .sketch-box { height: 190mm !important; margin-top: 5mm !important; }
            
            .photo-grid { grid-template-columns: 1fr 1fr; gap: 10px !important; margin-top: 5px !important; }
            .photo-box { border: 1px solid #aaa !important; padding: 5px !important; background: transparent !important; }
            .img-container { height: 75mm !important; border: none !important; }
            
            .footer { position: absolute; bottom: 10mm; left: 15mm; right: 15mm; border-top: 1px solid #ccc !important; color: #555 !important; }
        }
    </style>
</head>
<body>

<div id="controls" class="no-print">
    <button class="primary-btn" onclick="window.print()">🖨️ PDF / Druck</button>
    <button onclick="sendEmail()">✉️ Senden</button>
    <hr style="width:100%; border:0; border-top:1px solid rgba(0,0,0,0.1); margin: 5px 0;">
    <button onclick="document.getElementById('photoInput').click()">📸 Fotos (+)</button>
    <input type="file" id="photoInput" multiple accept="image/*" style="display:none" onchange="handlePhotos(this)">
    <button onclick="clearSketch()">🧽 Skizze weg</button>
    <hr style="width:100%; border:0; border-top:1px solid rgba(0,0,0,0.1); margin: 5px 0;">
    <button onclick="exportFullReport()">💾 Speichern</button>
    <button onclick="document.getElementById('importFile').click()">📂 Laden</button>
    <input type="file" id="importFile" accept=".lok,application/json" style="display:none" onchange="importFullReport(this)">
</div>
