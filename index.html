    });
    return d;
}

async function exportFullReport() {
    saveCustomers(); 
    const d = getReportData();
    const fileName = buildReportBaseName().replace(/[/\\?%*:|"<>]/g, '-') + '.lok';
    const jsonStr = JSON.stringify(d);

    try {
        if (window.showSaveFilePicker) {
            const handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: [{ description: 'Brugger Bericht', accept: { 'application/json': ['.lok'] } }],
            });
            const writable = await handle.createWritable();
            await writable.write(jsonStr);
            await writable.close();
            showToast("Bericht gespeichert!", "success");
            return;
        }
    } catch (e) { if (e.name === 'AbortError') return; }

    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([jsonStr], {type:'application/octet-stream'}));
    a.download = fileName; a.click();
    showToast("Bericht gespeichert!", "success");
}

function importFromStart(inp) {
    const f = inp.files?.[0]; if(!f) return; const r = new FileReader();
    r.onload = e => { try { const d = JSON.parse(e.target.result); startApp(d.appType || (d.byId?.['rohrmaterial'] ? 'KB' : (d.byId?.['checkAuftraggeber']!==undefined&&!d.toggles?.sketchEnabled?'RB':'LO'))); requestAnimationFrame(() => { restoreFromData(d); showToast("Bericht geladen", "success"); }); } catch(err) { console.error(err); showToast('Datei fehlerhaft.', 'error'); } };
    r.readAsText(f); inp.value='';
}

function restoreFromData(d) {
    if(!d || typeof d!=='object') return;
    if(d.byId) Object.keys(d.byId).forEach(id => { const el = document.getElementById(id); if(el && el.type!=='checkbox') { el.value=d.byId[id]; if(el.tagName==='TEXTAREA') autoResize.call(el); } });
    if(d.inputsNoId) { let i=0; document.querySelectorAll('#app-root input').forEach(el=>{ if(el.type!=='checkbox'&&el.type!=='file'&&!el.id) el.value=d.inputsNoId[i++]||''; }); }
    if(d.textareasNoId) { let i=0; document.querySelectorAll('#app-root textarea').forEach(el=>{ if(!el.id) { el.value=d.textareasNoId[i++]||''; autoResize.call(el); } }); }
    if(d.selectsNoId) { let i=0; document.querySelectorAll('#app-root select').forEach(el=>{ if(!el.id) el.value=d.selectsNoId[i++]||''; }); }
    if(d.checkStatesOrdered) Array.from(document.querySelectorAll('#app-root input[type="checkbox"]')).forEach((c,i)=>c.checked=!!d.checkStatesOrdered[i]);
    
    if(d.toggles && typeof d.toggles.auftraggeberEnabled==='boolean' && document.getElementById('checkAuftraggeber')) { document.getElementById('checkAuftraggeber').checked=d.toggles.auftraggeberEnabled; toggleAuftraggeber(); }
    if(d.toggles && typeof d.toggles.photoNumberingEnabled==='boolean' && document.getElementById('checkPhotoNumbering')) { document.getElementById('checkPhotoNumbering').checked=d.toggles.photoNumberingEnabled; togglePhotoNumbering(); }
    
    if(currentApp==='LO' || currentApp==='KB' || currentApp==='DL') {
        if (currentApp==='LO') { applyReparaturState(); applyFlachdachState(); applyPoolState(); }
        if(d.toggles && typeof d.toggles.sketchEnabled==='boolean' && document.getElementById('toggleSketch')) { document.getElementById('toggleSketch').checked=d.toggles.sketchEnabled; document.getElementById('toggleSketch').dispatchEvent(new Event('change')); }
        if(d.sketch?.bg) { const i=new Image(); i.onload=()=>document.getElementById('sketch-bg-canvas').getContext('2d').drawImage(i,0,0); i.src=d.sketch.bg; }
        if(d.sketch?.lines||d.sketch?.png) { const i=new Image(); i.onload=()=>document.getElementById('sketch-canvas').getContext('2d').drawImage(i,0,0); i.src=d.sketch.lines||d.sketch.png; }
    } else {
        updateDynamicRows();
        if(d.signature?.png && sigCtx) { const i=new Image(); i.onload=()=>sigCtx.drawImage(i,0,0); i.src=d.signature.png; }
    }
    
    const c = document.getElementById('photoPagesContainer'); c.innerHTML='';
    (d.photos||[]).forEach(p => {
        const pg = document.createElement('div'); pg.className='page'; const gId = 'grid-restore-'+p.index;
        const headerStyle = currentApp==='DL' ? 'style="background: var(--dl-header-bg); color: var(--dl-header-text); border-color: var(--dl-header-border);"' : '';
        pg.innerHTML = `<div class="header"><div class="header-top"><img src="Logo.PNG" alt="Brugger Logo" class="logo" onerror="this.style.display='none'"><div class="header-right"><strong>Brugger Entfeuchtung & Kanaltechnik GmbH</strong><br>Liebenauer Hauptstraße 181, 8041 Graz<br>Tel: +43 316 471771</div></div><h1 class="header-title" ${headerStyle}>Fotodokumentation</h1></div><div class="photo-grid" id="${gId}"></div><div class="footer"><span>Brugger GmbH</span><span class="page-no"></span></div>`;
        c.appendChild(pg); p.images.forEach(img => insertPhotoBox(img.dataUrl, gId, img.description, img.arrow));
    });
    updateTitleWithAddress();
}
function debounce(fn, w) { let t; return function() { clearTimeout(t); t = setTimeout(()=>fn.apply(this, arguments), w); }; }

// Globale Variablen für Signatur
let sigCanvas = null;
let sigCtx = null;

/* =========================================================
   CUSTOMER DATABASE
   ========================================================= */
function saveCustomers() {
    let customers = JSON.parse(localStorage.getItem('brugger_customers')) || [];
    const save = (prefix) => {
        const name = document.getElementById(prefix + 'name')?.value.trim();
        const adr = document.getElementById(prefix + 'adresse')?.value.trim();
        if (!name && !adr) return;
        const telId = prefix ? prefix + 'tel' : 'telefon';
        const customerData = { name: name, adresse: adr, plz: document.getElementById(prefix + 'plz')?.value.trim(), ort: document.getElementById(prefix + 'ort')?.value.trim(), telefon: document.getElementById(telId)?.value.trim() };
        const existingIndex = customers.findIndex(c => c.name === customerData.name && c.plz === customerData.plz);
        if (existingIndex > -1) customers[existingIndex] = { ...customers[existingIndex], ...customerData };
        else { customerData.id = Date.now() + Math.random(); customers.push(customerData); }
    };
    save('');
    if (document.getElementById('checkAuftraggeber')?.checked) save('auftraggeber_');
    localStorage.setItem('brugger_customers', JSON.stringify(customers));
}

const debouncedCustomerSearch = debounce(handleCustomerSearch, 200);

function handleCustomerSearch(input, type) {
    const searchTerm = input.value.toLowerCase();
    const resultsContainer = document.getElementById(type === 'main' ? 'mainCustomerResults' : 'billingCustomerResults');
    const customers = JSON.parse(localStorage.getItem('brugger_customers')) || [];
    resultsContainer.innerHTML = '';
    if (searchTerm.length < 2) { resultsContainer.style.display = 'none'; return; }

    const filtered = customers.filter(c => (c.name && c.name.toLowerCase().includes(searchTerm)) || (c.adresse && c.adresse.toLowerCase().includes(searchTerm)) || (c.ort && c.ort.toLowerCase().includes(searchTerm)));
    if (filtered.length === 0) { resultsContainer.style.display = 'none'; return; }

    filtered.slice(0, 10).forEach(customer => {
        const div = document.createElement('div'); div.className = 'result-item'; div.style.display = 'flex'; div.style.justifyContent = 'space-between'; div.style.alignItems = 'center';
        const info = document.createElement('div'); info.innerHTML = `<strong>${customer.name || ''}</strong><br><small>${customer.adresse || ''}, ${customer.plz || ''} ${customer.ort || ''}</small>`;
        const delBtn = document.createElement('div'); delBtn.innerText = '🗑️'; delBtn.title = 'Löschen'; delBtn.style.cssText = 'padding:5px; cursor:pointer; opacity:0.6; font-size:14px;';
        delBtn.onmouseover = () => delBtn.style.opacity = 1; delBtn.onmouseout = () => delBtn.style.opacity = 0.6;
        delBtn.onclick = (e) => { e.stopPropagation(); deleteCustomer(customer.id, type); };
        div.onclick = () => selectCustomer(customer.id, type);
        div.appendChild(info); div.appendChild(delBtn);
        resultsContainer.appendChild(div);
    });
    resultsContainer.style.display = 'block';
}

function deleteCustomer(id, type) {
    if(!confirm("Diesen Eintrag wirklich löschen?")) return;
    let customers = JSON.parse(localStorage.getItem('brugger_customers')) || [];
    customers = customers.filter(c => c.id !== id);
    localStorage.setItem('brugger_customers', JSON.stringify(customers));
    const input = document.getElementById(type === 'main' ? 'mainCustomerSearch' : 'billingCustomerSearch');
    if(input) handleCustomerSearch(input, type);
    showToast("Eintrag gelöscht", "info");
}

function selectCustomer(customerId, type) {
    const customer = (JSON.parse(localStorage.getItem('brugger_customers')) || []).find(c => c.id === customerId);
    if (!customer) return;
    const prefix = type === 'main' ? '' : 'auftraggeber_';
    const telId = type === 'main' ? 'telefon' : 'auftraggeber_tel';
    ['name', 'adresse', 'plz', 'ort'].forEach(f => { if(document.getElementById(prefix + f)) document.getElementById(prefix + f).value = customer[f] || ''; });
    if(document.getElementById(telId)) document.getElementById(telId).value = customer.telefon || '';
    document.getElementById(type === 'main' ? 'mainCustomerResults' : 'billingCustomerResults').style.display = 'none';
    document.getElementById(type === 'main' ? 'mainCustomerSearch' : 'billingCustomerSearch').value = '';
    updateTitleWithAddress(); showToast("Kundendaten eingefügt", "success");
}

/* =========================================================
   AUTO-SAVE & TOASTS
   ========================================================= */
function showToast(msg, type='info') {
    let c = document.getElementById('toast-container');
    if(!c) { c = document.createElement('div'); c.id='toast-container'; document.body.appendChild(c); }
    const t = document.createElement('div'); t.className = `toast ${type}`; t.innerText = msg;
    c.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}

function saveToLocal() {
    if(!currentApp) return;
    const d = getReportData();
    try {
        localStorage.setItem('brugger_autosave', JSON.stringify(d));
    } catch (e) {
        if (e.name === 'QuotaExceededError' || e.code === 22) {
            // Speicher voll - Autosave stillschweigend ignorieren oder Loggen, um Absturz zu verhindern
            console.warn("Autosave fehlgeschlagen: Speicher voll (zu viele Fotos?)");
        }
    }
}

function checkAutoSave() {
    const saved = localStorage.getItem('brugger_autosave');
    const btn = document.getElementById('btnRestoreAutosave');
    if(saved && btn) {
        btn.style.display = 'flex';
        try { const d = JSON.parse(saved); if(d.appType) btn.innerHTML = `🔄 Entwurf (${d.appType}) wiederherstellen`; } catch(e){}
    }
}

function restoreAutosave() {
    const saved = localStorage.getItem('brugger_autosave');
    if(!saved) return;
    try {
        const d = JSON.parse(saved);
        startApp(d.appType);
        setTimeout(() => { restoreFromData(d); showToast('Entwurf wiederhergestellt', 'success'); }, 200);
    } catch(e) { showToast('Fehler beim Laden des Entwurfs', 'error'); }
}

function applyTheme() {
    const isDark = localStorage.getItem('brugger_darkmode') === 'true';
    document.body.classList.toggle('dark-mode', isDark);
    const cb = document.getElementById('settingsDarkMode');
    if(cb) cb.checked = isDark;
}

function initializeApp() {
    try {
        loadTemplates();
        checkAutoSave();
        applyTheme();
        
        const appRoot = document.getElementById('app-root');
        appRoot.addEventListener('input', debounce(saveToLocal, 1000));
        appRoot.addEventListener('change', debounce(saveToLocal, 1000));

        cropCvs = document.getElementById('cropCanvas');
        if(cropCvs) {
            cropCtx = cropCvs.getContext('2d');
            cropCvs.addEventListener('pointerdown', e => { isCrop = true; const r = cropCvs.getBoundingClientRect(); cx1 = e.clientX-r.left; cy1 = e.clientY-r.top; cx2=cx1; cy2=cy1; drawCrop(); e.preventDefault(); });
            cropCvs.addEventListener('pointermove', e => { if(!isCrop) return; const r = cropCvs.getBoundingClientRect(); cx2 = e.clientX-r.left; cy2 = e.clientY-r.top; drawCrop(); e.preventDefault(); });
            window.addEventListener('pointerup', () => isCrop=false); window.addEventListener('pointercancel', () => isCrop=false);
        }
    } catch(e) {
        console.error("Fehler bei der Initialisierung: ", e);
        alert("Ein kritischer Fehler ist beim Starten der App aufgetreten. Bitte versuchen Sie, die Seite neu zu laden oder den App-Reset zu verwenden.");
    }
}
window.addEventListener('DOMContentLoaded', initializeApp);

/* =========================================================
   PHOTO EDITOR & PWA
   ========================================================= */
let peCvs, peCtx, peImg, peHist=[], peMode='arrow', peColor='red', peActiveImgEl=null;

function openPhotoEditor(container) {
    peActiveImgEl = container.querySelector('img');
    if(!peActiveImgEl) return;
    const modal = document.getElementById('photoEditorModal');
    peCvs = document.getElementById('photoEditorCanvas');
    peCtx = peCvs.getContext('2d');
    
    const img = new Image();
    img.onload = () => {
        let w=img.width, h=img.height;
        const maxW=1000, maxH=1000;
        if(w>maxW || h>maxH) { const r=Math.min(maxW/w, maxH/h); w*=r; h*=r; }
        peCvs.width=w; peCvs.height=h;
        peCtx.drawImage(img,0,0,w,h);
        peImg = img; peHist = [peCvs.toDataURL()];
        modal.style.display='flex';
    };
    img.src = peActiveImgEl.src;
    
    let drawing=false, sx, sy;
    peCvs.onpointerdown = e => {
        e.preventDefault(); drawing=true;
        const r=peCvs.getBoundingClientRect(); sx=(e.clientX-r.left)*(peCvs.width/r.width); sy=(e.clientY-r.top)*(peCvs.height/r.height);
        if(peMode==='text') {
            const text = prompt("Text eingeben:", "");
            if(text) {
                peCtx.fillStyle = peColor; peCtx.font = "bold 40px Arial"; peCtx.fillText(text, sx, sy);
                peHist.push(peCvs.toDataURL());
            }
            drawing=false;
        }
    };
    peCvs.onpointermove = e => {
        if(!drawing || peMode==='text') return; e.preventDefault();
        const r=peCvs.getBoundingClientRect(); const cx=(e.clientX-r.left)*(peCvs.width/r.width), cy=(e.clientY-r.top)*(peCvs.height/r.height);
        
        const img = new Image(); img.onload = () => {
            peCtx.clearRect(0,0,peCvs.width,peCvs.height); peCtx.drawImage(img,0,0);
            peCtx.beginPath(); peCtx.strokeStyle=peColor; peCtx.lineWidth=5; peCtx.fillStyle=peColor;
            
            if(peMode==='arrow') {
                const headlen = 20; const angle = Math.atan2(cy-sy,cx-sx);
                peCtx.moveTo(sx, sy); peCtx.lineTo(cx, cy); peCtx.stroke();
                peCtx.beginPath(); peCtx.moveTo(cx, cy);
                peCtx.lineTo(cx-headlen*Math.cos(angle-Math.PI/6), cy-headlen*Math.sin(angle-Math.PI/6));
                peCtx.lineTo(cx-headlen*Math.cos(angle+Math.PI/6), cy-headlen*Math.sin(angle+Math.PI/6));
                peCtx.fill();
            } else if(peMode==='circle') {
                peCtx.beginPath(); const rad = Math.sqrt(Math.pow(cx-sx,2)+Math.pow(cy-sy,2));
                peCtx.arc(sx, sy, rad, 0, 2*Math.PI); peCtx.stroke();
            } else if(peMode==='rect') {
                peCtx.strokeRect(sx, sy, cx-sx, cy-sy);
            }
        }; img.src = peHist[peHist.length-1];
    };
    peCvs.onpointerup = () => { if(drawing && peMode!=='text') peHist.push(peCvs.toDataURL()); drawing=false; };
}

function setPE_Mode(m, el) { peMode=m; document.querySelectorAll('#photoEditorModal .mode-tool').forEach(t=>t.classList.remove('active')); el.classList.add('active'); }
function setPE_Color(c, el) { peColor=c; document.querySelectorAll('#photoEditorModal .color-tool').forEach(t=>t.classList.remove('active')); el.classList.add('active'); }
function undoPE() { if(peHist.length>1) { peHist.pop(); const i=new Image(); i.onload=()=>peCtx.drawImage(i,0,0); i.src=peHist[peHist.length-1]; } }
function closePhotoEditor() { document.getElementById('photoEditorModal').style.display='none'; }
function savePhotoEditor() { if(peActiveImgEl) peActiveImgEl.src = peCvs.toDataURL('image/jpeg', 0.4); closePhotoEditor(); }

function rotatePE(degrees) {
    if (!peCvs || !peCtx) return;
    const rad = degrees * Math.PI / 180;
    const w = peCvs.width; const h = peCvs.height;
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = w; tempCanvas.height = h;
    tempCanvas.getContext('2d').drawImage(peCvs, 0, 0);
    peCvs.width = h; peCvs.height = w;
    peCtx.save(); peCtx.translate(h / 2, w / 2); peCtx.rotate(rad); peCtx.drawImage(tempCanvas, -w / 2, -h / 2); peCtx.restore();
    peHist.push(peCvs.toDataURL());
}

function setupPWA() {
    // PWA / Service Worker mit Network-First Strategie (löst Caching-Probleme + ermöglicht Offline)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        const swCode = `
            const CACHE_NAME = 'brugger-offline-v5'; // Cache-Version erhöht
            const PRECACHE_ASSETS = ['./', 'Logo.PNG'];

            self.addEventListener('install', e => {
                e.waitUntil(
                    caches.open(CACHE_NAME)
                        .then(cache => cache.addAll(PRECACHE_ASSETS))
                        .then(() => self.skipWaiting())
                );
            });

            self.addEventListener('activate', e => {
                e.waitUntil(
                    caches.keys().then(keys => Promise.all(
                        keys.map(key => {
                            if (key !== CACHE_NAME) return caches.delete(key);
                        })
                    )).then(() => self.clients.claim())
                );
            });

            self.addEventListener('fetch', e => {
                if (e.request.method !== 'GET') return;
                e.respondWith(
                    fetch(e.request)
                        .then(res => {
                            const resClone = res.clone();
                            caches.open(CACHE_NAME).then(c => c.put(e.request, resClone));
                            return res;
                        })
                        .catch(() => caches.match(e.request)) // Fallback auf Cache
                );
            });
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob))
            .then(() => console.log('Offline-Modus mit Pre-Caching aktiviert'))
            .catch(e => console.error('SW Error', e));
    }
}

   SETTINGS
   ========================================================= */
function openSettings() { 
    document.getElementById('settingsModal').style.display = 'flex';
    document.getElementById('settingsEmail').value = localStorage.getItem('brugger_email') || 'kanal@brugger-entfeuchtung.at';
    document.getElementById('settingsTechnician').value = localStorage.getItem('brugger_techniker') || '';

}
function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
function saveSettings() {
    const email = document.getElementById('settingsEmail').value.trim();
    const tech = document.getElementById('settingsTechnician').value.trim();
    if(email) localStorage.setItem('brugger_email', email); else localStorage.removeItem('brugger_email');

   TEMPLATE MANAGER
   ========================================================= */
function loadTemplates() {
    try {
        const stored = localStorage.getItem('brugger_templates');
        if(stored) textTemplates = JSON.parse(stored);
        else { textTemplates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)); localStorage.setItem('brugger_templates', JSON.stringify(textTemplates)); }
    } catch(e) { textTemplates = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)); }
}

function hardResetApp() {
    if(confirm("ACHTUNG: Dies löscht alle gespeicherten Daten (Einstellungen, Entwürfe, Vorlagen) und setzt die App komplett zurück.\n\nDies hilft oft, wenn die App nicht mehr reagiert.\n\nFortfahren?")) {
        try { localStorage.clear(); } catch(e){}
        try { if(navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(rs){ for(let r of rs) r.unregister(); }); } catch(e){}
        location.reload();
    }
}
