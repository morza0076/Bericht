<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familien Planer - Smart Edition</title>
    <style>
        :root { 
            --alle: #2c3e50; --michi: #0984e3; --peter: #6c5ce7; 
            --liah: #00cec9; --oskar: #00b894;
            --la: #e67e22; --sch-liah: #8e44ad; --sch-oskar: #55efc4;
            --geburtstag: #f1c40f; --todo-red: #d63031; --feiertag: #e74c3c;
            --bg: #f5f6fa; --card-bg: #ffffff; 
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .main-layout { display: grid; grid-template-columns: 1.4fr 0.6fr; gap: 20px; max-width: 1500px; margin: auto; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        #calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day { min-height: 110px; background: #fff; border: 1px solid #eee; padding: 4px; border-radius: 4px; font-size: 0.8em; transition: 0.2s; cursor: pointer; }
        .day:hover { border-color: var(--michi); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .day.today { border: 2px solid #2f3640; }
        .day.ferien { background-color: #d4edda; border-color: #c3e6cb; } 
        .date-num { font-weight: bold; margin-bottom: 4px; display: block; }

        .ev { padding: 3px 5px; border-radius: 3px; color: white; margin-bottom: 3px; font-size: 0.75em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; width: calc(100% - 10px); }
        .ev-alle { background: var(--alle); font-weight: bold; }
        .ev-michi { background: var(--michi); }
        .ev-peter { background: var(--peter); }
        .ev-liah { background: var(--liah); color: #2d3436; }
        .ev-oskar { background: var(--oskar); }
        .ev-la { background: var(--la); }
        .ev-sch-liah { background: var(--sch-liah); color: white; }
        .ev-sch-oskar { background: var(--sch-oskar); color: #2d3436; }
        .ev-geburtstag { background: var(--geburtstag); color: #2d3436; font-weight: bold; }
        .ev-todo { background: var(--todo-red); border-left: 3px solid black; color: white; }
        .ev-feiertag { background: var(--feiertag); color: white; font-weight: bold; }
        .time-badge { opacity: 0.85; margin-right: 4px; font-size: 0.9em; }

        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
        select, input, button { padding: 8px; border-radius: 5px; border: 1px solid #ddd; font-size: 0.9em; font-family: inherit; }
        button { background: #2f3640; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .time-row { display: flex; gap: 5px; align-items: center; }
        .time-row input { flex: 1; }
        .list-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; font-size: 0.85em; }
        .del { color: #e74c3c; cursor: pointer; font-weight: bold; margin-left: 10px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(2px); }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-header h2 { margin: 0; color: #2c3e50; font-size: 1.4em; }
        .close-btn { background: #eee; color: #333; border-radius: 50%; width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.2em; border: none;}
        .close-btn:hover { background: #ff7675; color: white; }
        .day-detail-item { padding: 12px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; font-size: 0.95em; }
        .day-detail-item:last-child { border-bottom: none; }
        .day-detail-item .ev { width: auto; font-size: 0.85em; padding: 4px 8px; margin-bottom: 5px; }

        @media (max-width: 1100px) { .main-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header style="text-align: center; margin-bottom: 20px;">
    <h1>🏠 Familien Planer</h1>
</header>

<div class="main-layout">
    <section class="card">
        <div id="calendar-header">
            <button onclick="changeMonth(-1)">◀</button>
            <h2 id="monthDisplay"></h2>
            <button onclick="changeMonth(1)">▶</button>
        </div>
        <div class="calendar-grid" id="calendarGrid">
            <div style="text-align:center; font-weight:bold">Mo</div><div style="text-align:center; font-weight:bold">Di</div>
            <div style="text-align:center; font-weight:bold">Mi</div><div style="text-align:center; font-weight:bold">Do</div>
            <div style="text-align:center; font-weight:bold">Fr</div><div style="text-align:center; font-weight:bold">Sa</div>
            <div style="text-align:center; font-weight:bold">So</div>
        </div>
    </section>

    <aside>
        <div class="card">
            <h3>📅 Neuer Termin / Geburtstag</h3>
            <div class="input-group">
                <input type="text" id="termTitle" placeholder="Was steht an? (Name für Geburtstag)">
                
                <div class="time-row">
                    <input type="date" id="termDate" title="Startdatum" required>
                    <span>bis</span>
                    <input type="date" id="termEndDate" title="Enddatum">
                </div>
                
                <div class="time-row">
                    <input type="time" id="termStart" title="Startzeit">
                    <span>bis</span>
                    <input type="time" id="termEnd" title="Endzeit">
                </div>

                <select id="termType">
                    <option value="alle">👨‍👩‍👧‍👦 Alle zusammen (Dunkelblau)</option>
                    <option value="michi">👤 Michi (Blau)</option>
                    <option value="peter">👤 Peter (Lila)</option>
                    <option value="liah">👤 Liah (Türkis)</option>
                    <option value="oskar">👤 Oskar (Grün)</option>
                    <option value="la">🏃 Leichtathletik (Orange)</option>
                    <option value="sch-liah">🏫 Schule Liah (Violett)</option>
                    <option value="sch-oskar">🏫 Schule Oskar (Mintgrün)</option>
                    <option value="geburtstag">🎂 Geburtstag (Jährlich!)</option>
                </select>
                <button onclick="addTerm()">Speichern</button>
            </div>
        </div>

        <div class="card">
            <h3>✅ Aufgaben (To-Do)</h3>
            <div class="input-group">
                <input type="text" id="todoInput" placeholder="Hausarbeit, Erledigung...">
                <input type="date" id="todoDate">
                <button onclick="addTodo()" style="background:var(--todo-red)">Aufgabe merken</button>
            </div>
            <div id="todoList" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </aside>
</div>

<div class="modal-overlay" id="dayModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2 id="modalDateTitle">Datum</h2>
            <button class="close-btn" onclick="closeModal(event, true)">✕</button>
        </div>
        <div id="modalContentList"></div>
    </div>
</div>

<script>
    // Automatisches Mitspringen des Enddatums!
    document.getElementById('termDate').addEventListener('change', function() {
        const endDateInput = document.getElementById('termEndDate');
        endDateInput.min = this.value; // Man kann kein Enddatum vor dem Startdatum wählen
        if (!endDateInput.value || endDateInput.value < this.value) {
            endDateInput.value = this.value;
        }
    });

    const typeNames = {
        'alle': '👨‍👩‍👧‍👦 Alle', 'michi': '👤 Michi', 'peter': '👤 Peter', 'liah': '👤 Liah', 'oskar': '👤 Oskar',
        'la': '🏃 Leichtathletik', 'sch-liah': '🏫 Schule Liah', 'sch-oskar': '🏫 Schule Oskar', 'geburtstag': 'Geburtstag'
    };

    let db = JSON.parse(localStorage.getItem('famPlanner_v12')) || { terms: [], todos: [] };
    let viewDate = new Date();
    let currentModalDate = null;

    // Cache für die LIVE API (Feiertage & Ferien)
    let apiCacheFeiertage = {};
    let apiCacheFerien = {};

    async function fetchHolidays(year) {
        if(apiCacheFeiertage[year]) return; // Wurde schon geladen
        
        apiCacheFeiertage[year] = []; // Platzhalter, um doppeltes Laden zu verhindern
        apiCacheFerien[year] = [];

        try {
            // Holt österreichische Feiertage live
            let res = await fetch(`https://openholidaysapi.org/PublicHolidays?countryIsoCode=AT&languageIsoCode=DE&validFrom=${year}-01-01&validTo=${year}-12-31`);
            let data = await res.json();
            apiCacheFeiertage[year] = data.map(h => ({ date: h.startDate, name: h.name[0].text }));

            // Holt steirische Schulferien (AT-6) live
            let res2 = await fetch(`https://openholidaysapi.org/SchoolHolidays?countryIsoCode=AT&subdivisionCode=AT-6&languageIsoCode=DE&validFrom=${year}-01-01&validTo=${year}-12-31`);
            let data2 = await res2.json();
            apiCacheFerien[year] = data2.map(h => ({ start: h.startDate, end: h.endDate }));

            renderCalendar(); // Rendert den Kalender neu, sobald die Daten da sind
        } catch (e) {
            console.error("Konnte aktuelle Ferien/Feiertage nicht laden.", e);
        }
    }

    function isFerien(dateStr) { 
        const year = dateStr.substring(0, 4);
        if(!apiCacheFerien[year]) return false;
        return apiCacheFerien[year].some(f => dateStr >= f.start && dateStr <= f.end); 
    }
    
    function getFeiertag(dateStr) { 
        const year = dateStr.substring(0, 4);
        if(!apiCacheFeiertage[year]) return null;
        return apiCacheFeiertage[year].find(f => f.date === dateStr); 
    }

    function save() {
        localStorage.setItem('famPlanner_v12', JSON.stringify(db));
        render();
        if(currentModalDate) openDayView(currentModalDate); 
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();
        document.getElementById('monthDisplay').innerText = new Intl.DateTimeFormat('de-DE', { month: 'long', year: 'numeric' }).format(viewDate);
        
        // Lade Feiertage & Ferien dynamisch für das angezeigte Jahr!
        if(!apiCacheFeiertage[year]) { fetchHolidays(year); }

        while(grid.children.length > 7) grid.removeChild(grid.lastChild);
        const first = new Date(year, month, 1).getDay();
        const offset = (first === 0) ? 6 : first - 1;
        for(let i=0; i < offset; i++) grid.appendChild(document.createElement('div'));

        const today = new Date().toISOString().split('T')[0];

        for(let d=1; d <= new Date(year, month + 1, 0).getDate(); d++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day';
            const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            
            dayDiv.onclick = () => openDayView(dateStr);
            
            if(dateStr === today) dayDiv.classList.add('today');
            if(isFerien(dateStr)) dayDiv.classList.add('ferien');
            
            dayDiv.innerHTML = `<span class="date-num">${d}</span>`;
            
            const feiertag = getFeiertag(dateStr);
            if(feiertag) dayDiv.innerHTML += `<div class="ev ev-feiertag">${feiertag.name}</div>`;

            // Termine & Geburtstage filtern
            let daysTerms = db.terms.filter(t => {
                if (t.type === 'geburtstag') {
                    // Geburtstag: Prüft nur ob Monat und Tag übereinstimmen (-MM-DD)
                    return t.date.substring(5) === dateStr.substring(5);
                } else {
                    // Normale Termine: Prüft Zeitraum zwischen Start und Enddatum
                    let eDate = t.endDate || t.date;
                    return dateStr >= t.date && dateStr <= eDate;
                }
            });

            daysTerms.sort((a, b) => (a.start || "24:00").localeCompare(b.start || "24:00"));

            daysTerms.forEach(t => {
                let displayTitle = t.title;
                let iconStr = '';
                
                // Geburtstags-Logik (Alter berechnen)
                if (t.type === 'geburtstag') {
                    iconStr = '🎂 ';
                    let birthYear = parseInt(t.date.substring(0,4));
                    let currentYear = parseInt(dateStr.substring(0,4));
                    let age = currentYear - birthYear;
                    if (age > 0) displayTitle += ` (${age})`; // Zeigt das Alter an!
                }

                let timeStr = '';
                if(t.type !== 'geburtstag' && t.start) {
                    timeStr = t.start;
                    if(t.end) timeStr += '-' + t.end;
                    timeStr = `<span class="time-badge">[${timeStr}]</span>`;
                }
                dayDiv.innerHTML += `<div class="ev ev-${t.type}">${iconStr}${timeStr}${displayTitle}</div>`;
            });
            
            db.todos.filter(t => t.date === dateStr).forEach(t => {
                dayDiv.innerHTML += `<div class="ev ev-todo">📍 ${t.text}</div>`;
            });
            grid.appendChild(dayDiv);
        }
    }

    function openDayView(dateStr) {
        currentModalDate = dateStr;
        const modal = document.getElementById('dayModal');
        const content = document.getElementById('modalContentList');
        const dParts = dateStr.split('-');
        document.getElementById('modalDateTitle').innerText = `${dParts[2]}.${dParts[1]}.${dParts[0]}`;

        let html = '';
        if(isFerien(dateStr)) html += `<div class="day-detail-item" style="background:#e8f5e9; border-left:4px solid #28a745; color:#155724; font-weight:bold;">🎒 Schulferien (Steiermark)</div>`;
        const feiertag = getFeiertag(dateStr);
        if(feiertag) html += `<div class="day-detail-item" style="background:#fff0f0; border-left:4px solid var(--feiertag); color:#c0392b; font-weight:bold;">🇦🇹 Feiertag: ${feiertag.name}</div>`;

        let daysTerms = db.terms.filter(t => {
            if (t.type === 'geburtstag') return t.date.substring(5) === dateStr.substring(5);
            return dateStr >= t.date && dateStr <= (t.endDate || t.date);
        });
        
        daysTerms.sort((a, b) => (a.start || "24:00").localeCompare(b.start || "24:00"));
        
        daysTerms.forEach(t => {
            let timeInfo = (t.start && t.type !== 'geburtstag') ? `🕑 ${t.start}${t.end ? ' - '+t.end : ''} Uhr` : 'Ganztägig';
            if (t.endDate && t.endDate !== t.date && t.type !== 'geburtstag') timeInfo += ` (Mehrtägig bis ${t.endDate.split('-').reverse().join('.')})`;
            
            let displayTitle = t.title;
            let iconStr = '';
            if (t.type === 'geburtstag') {
                iconStr = '🎂 ';
                let age = parseInt(dateStr.substring(0,4)) - parseInt(t.date.substring(0,4));
                if (age > 0) displayTitle += ` (${age}. Geburtstag)`;
            }

            html += `<div class="day-detail-item">
                        <div>
                            <div class="ev ev-${t.type}">${iconStr}${typeNames[t.type]}</div><br>
                            <span style="font-size:1.1em; font-weight:bold;">${displayTitle}</span><br>
                            <small style="color:#7f8c8d;">${timeInfo}</small>
                        </div>
                        <span class="del" style="font-size:1.5em;" onclick="deleteItem('terms', ${t.id}); event.stopPropagation();" title="Löschen">🗑️</span>
                     </div>`;
        });

        db.todos.filter(t => t.date === dateStr).forEach(t => {
            html += `<div class="day-detail-item">
                        <div><div class="ev ev-todo">📍 To-Do (Frist)</div><br><span style="font-size:1.1em; font-weight:bold;">${t.text}</span></div>
                        <span class="del" style="font-size:1.5em;" onclick="deleteItem('todos', ${t.id}); event.stopPropagation();" title="Löschen">🗑️</span>
                     </div>`;
        });

        if(html === '') html = '<p style="text-align:center; color:#95a5a6; padding: 20px;">Keine Termine für diesen Tag.</p>';
        content.innerHTML = html;
        modal.style.display = 'flex';
    }

    function closeModal(e, force = false) {
        if(force || e.target.id === 'dayModal') {
            document.getElementById('dayModal').style.display = 'none';
            currentModalDate = null;
        }
    }

    function addTerm() {
        const title = document.getElementById('termTitle').value;
        const date = document.getElementById('termDate').value;
        const endDate = document.getElementById('termEndDate').value || date; // Nimmt Startdatum, wenn leer
        const start = document.getElementById('termStart').value;
        const end = document.getElementById('termEnd').value;
        const type = document.getElementById('termType').value;
        
        if(!title || !date) return;
        db.terms.push({ id: Date.now(), title, date, endDate, start, end, type });
        
        document.getElementById('termTitle').value = ''; document.getElementById('termDate').value = ''; 
        document.getElementById('termEndDate').value = ''; document.getElementById('termStart').value = ''; document.getElementById('termEnd').value = '';
        save();
    }

    function addTodo() {
        const text = document.getElementById('todoInput').value;
        const date = document.getElementById('todoDate').value;
        if(!text) return;
        db.todos.push({ id: Date.now(), text, date });
        document.getElementById('todoInput').value = ''; document.getElementById('todoDate').value = '';
        save();
    }

    function renderTodos() {
        const container = document.getElementById('todoList');
        container.innerHTML = '';
        db.todos.sort((a,b) => {
            if (!a.date) return 1; if (!b.date) return -1;
            return (a.date > b.date) ? 1 : -1;
        }).forEach(t => {
            const dateStr = t.date ? ` (Bis: ${new Date(t.date).toLocaleDateString('de-DE')})` : '';
            container.innerHTML += `<div class="list-item">
                <span><b>${t.text}</b><br><small style="color:#7f8c8d;">${dateStr}</small></span>
                <span class="del" onclick="deleteItem('todos', ${t.id})">✕</span>
            </div>`;
        });
    }

    function deleteItem(type, id) { db[type] = db[type].filter(x => x.id !== id); save(); }
    function changeMonth(dir) { viewDate.setMonth(viewDate.getMonth() + dir); renderCalendar(); }
    function render() { renderCalendar(); renderTodos(); }
    
    render();
</script>
</body>
</html>
